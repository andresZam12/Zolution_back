# Alembic configuration for Zolution backend
# Full docs: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Migration file naming: timestamp + slug, e.g. 20240101_120000_create_users.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Prepend sys.path with src so app imports work during migrations
prepend_sys_path = .

# SQLAlchemy URL is set dynamically in env.py from app.core.config
# Do NOT hardcode credentials here
sqlalchemy.url =

[post_write_hooks]
# Optional: run ruff formatter on generated migration files
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------
# Logging configuration for Alembic CLI output
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
