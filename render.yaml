services:
  # ---------------------------------------------------------------------------
  # FastAPI Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: zolution-api
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "alembic upgrade head && python -m scripts.seed_data && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: zolution-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: zol_verify_sec_9941a

databases:
  # ---------------------------------------------------------------------------
  # Managed PostgreSQL 16 Database
  # ---------------------------------------------------------------------------
  - name: zolution-db
    databaseName: zolution
    user: zolution
    plan: free
